name: Release Chatobby plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.repository == 'TitanicEclair/chatobby-obsidian'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify release version
        run: |
          node -e "const fs=require('node:fs'); const packageVersion=JSON.parse(fs.readFileSync('package.json','utf8')).version; const manifestVersion=JSON.parse(fs.readFileSync('manifest.json','utf8')).version; if (packageVersion !== process.env.GITHUB_REF_NAME || manifestVersion !== process.env.GITHUB_REF_NAME) { throw new Error('Tag, package, and manifest versions must match'); }"

      - name: Check source and architecture
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build verified release assets
        env:
          CHATOBBY_RUNTIME_PUBLIC_KEY: ${{ vars.CHATOBBY_RUNTIME_PUBLIC_KEY }}
        run: npm run build:release

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            release/main.js \
            release/manifest.json \
            release/styles.css \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Chatobby ${GITHUB_REF_NAME}" \
            --notes-file "$notes_file"

      - name: Verify published release before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$GITHUB_REF_NAME"
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "false"
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name] | sort | join(",")')" = "main.js,manifest.json,styles.css"

      # The Community catalogue reads manifest.json from the default branch.
      # Advancing it before the matching GitHub release exists can remove the
      # entire plugin from in-app discovery.
      - name: Promote verified release to public main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if test "$current_main" != "$GITHUB_SHA"; then
            git fetch --no-tags origin \
              "${current_main}:refs/remotes/origin/public-main"
            git merge-base --is-ancestor "$current_main" "$GITHUB_SHA"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
              -f sha="$GITHUB_SHA" \
              -F force=false >/dev/null
          fi
          test "$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
